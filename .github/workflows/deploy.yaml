name: Deploy

on:
    push:
        branches: ["main"]
    workflow_dispatch:

jobs:
    ci:
        uses: ./.github/workflows/ci.yaml

    pipes:
        needs: ci
        uses: dragunovartem99/pipes/.github/workflows/deploy-vps.yaml@v1.2.0
        with:
            strategy: release
            setup: node
            build: npm run build
            upload: dist/ Caddyfile deploy.sh
            url: https://conspect.su
        secrets: inherit
